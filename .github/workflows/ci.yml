name: ZimRent CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/hardening-pass-1]

jobs:
  server-syntax:
    name: Server dependency and JavaScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          set -eu
          find . -path './node_modules' -prune -o -name '*.js' -type f -print | while IFS= read -r file; do
            node --check "$file"
          done
