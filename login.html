<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Sign In - Homify</title>
    <meta name="robots" content="index, follow">
    <meta name="description" content="Sign in to your Homify account to message landlords, save favourite listings and manage your student accommodation search near NUST.">
    <link rel="canonical" href="https://homify.onrender.com/login.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Homify">
    <meta property="og:title" content="Sign In - Homify">
    <meta property="og:description" content="Sign in to your Homify account to message landlords, save favourite listings and manage your student accommodation search near NUST.">
    <meta property="og:url" content="https://homify.onrender.com/login.html">
    <meta property="og:image" content="https://homify.onrender.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign In - Homify">
    <meta name="twitter:description" content="Sign in to your Homify account to message landlords, save favourite listings and manage your student accommodation search near NUST.">
    <meta name="twitter:image" content="https://homify.onrender.com/assets/og-image.png">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">Homi<span>fy</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="listings.html">Browse</a></li>
            <li><a href="register.html" id="nav-register">Register</a></li>
        </ul>
    </nav>
    <main id="main">
    <div class="container" style="max-width:450px; margin-top:2.5rem;">
        <div class="form-card">
            <h2 style="text-align:center; margin-bottom:0.3rem;">Welcome Back</h2>
            <p style="text-align:center; color:var(--text-muted); margin-bottom:1.5rem;">Sign in to your Homify account</p>
            
            <div id="auth-error" style="display:none; padding:0.8rem; background:#ffe6e6; color:var(--danger); border-radius:8px; margin-bottom:1rem; font-size:0.9rem;"></div>
            <div id="auth-success" style="display:none; padding:0.8rem; background:#d4edda; color:#155724; border-radius:8px; margin-bottom:1rem; font-size:0.9rem;"></div>
            
            <!-- Auth Method Tabs -->
            <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem;">
                <button class="auth-tab active" data-tab="email" style="flex:1; padding:0.6rem 0; border:none; border-radius:8px; font-weight:600; cursor:pointer; background:var(--primary); color:white;"><i class="fas fa-envelope"></i>&nbsp; Email</button>
                <button class="auth-tab" data-tab="phone" style="flex:1; padding:0.6rem 0; border:1px solid var(--border); border-radius:8px; font-weight:600; cursor:pointer; background:white; color:var(--text-dark);"><i class="fas fa-phone"></i>&nbsp; Phone</button>
                <button class="auth-tab" data-tab="social" style="flex:1; padding:0.6rem 0; border:1px solid var(--border); border-radius:8px; font-weight:600; cursor:pointer; background:white; color:var(--text-dark);"><i class="fas fa-globe"></i>&nbsp; Social</button>
            </div>

            <!-- Email Login -->
            <div class="auth-panel" id="panel-email">
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email Address *</label>
                        <input type="email" id="login-email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password *</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <div style="text-align:right; margin-top:0.3rem;">
                        <a href="forgot-password.html" style="font-size:0.85rem; color:var(--text-muted);">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;">Sign In</button>
                </form>
            </div>

            <!-- Phone OTP Login -->
            <div class="auth-panel" id="panel-phone" style="display:none;">
                <div id="phone-step-1">
                    <div class="form-group">
                        <label for="login-phone">Phone Number *</label>
                        <input type="tel" id="login-phone" placeholder="+263 77 000 0000" required>
                    </div>
                    <button id="send-otp-btn" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;" onclick="sendOTP()">Send OTP</button>
                </div>
                <div id="phone-step-2" style="display:none;">
                    <div class="form-group">
                        <label for="login-otp">Enter OTP Code *</label>
                        <input type="text" id="login-otp" placeholder="6-digit code" maxlength="6" required>
                    </div>
                    <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.5rem;">We sent a code to <strong id="otp-phone-display"></strong></p>
                    <button class="btn btn-success btn-lg" style="width:100%; margin-top:0.5rem;" onclick="verifyOTP()">Verify & Sign In</button>
                    <button class="btn btn-outline btn-sm" style="width:100%; margin-top:0.5rem;" onclick="resetPhoneLogin()">Change number</button>
                </div>
            </div>

            <!-- Social / Google Login -->
            <div class="auth-panel" id="panel-social" style="display:none; text-align:center;">
                <p style="color:var(--text-muted); margin-bottom:1.5rem;">Sign in with your social account</p>
                <button id="google-login-btn" class="btn btn-lg" style="width:100%; background:#fff; border:1px solid var(--border); color:var(--text-dark); display:flex; align-items:center; justify-content:center; gap:0.8rem; padding:0.8rem;" onclick="handleGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:22px; height:22px;" alt="Google">
                    Continue with Google
                </button>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:1rem;">Apple Sign-In coming soon</p>
            </div>
            
            <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:0.9rem;">
                Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600;">Register here</a>
            </p>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
        </main>
<script src="js/app.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/cookie-consent.js?v=1"></script>
</body>
</html>
